# ==============================================================================
#  nginx 侧配置片段（nginx for Windows 1.x，已确认无 GeoIP 模块，走 geo 变量 + 403）
#  把下方「第一部分」放进 http{} 尾部，「第二部分」放进每个对外 server{} 开头。
# ==============================================================================


# ------------------------------------------------------------------------------
# 第一部分：http { } 内
# ------------------------------------------------------------------------------

# 由 geoip-update.ps1 生成，内含 geo $geoip_block { default 1; 1.x.x.x/24 0; ... }
# 路径用正斜杠；注意 nginx/Windows 以「启动 nginx 时的目录」为 prefix，
# 用绝对路径最稳妥。
include C:/nginx/geoip/blocklist.conf;

# 例外路径：健康检查、ACME 证书校验、favicon 等不应受地域限制
# （Let's Encrypt / ZeroSSL 的 HTTP-01 校验节点遍布全球，不豁免会签不下证书）
map $request_uri $geoip_exempt {
    default                         0;
    ~^/healthz                      1;
    ~^/health\.html                 1;
    ~^/\.well-known/acme-challenge/ 1;
}

# 组合判定：block=1 且 非例外 -> 1
# 注意：map 的结果里拼接变量需 nginx >= 1.11（现在线上基本都满足）
map "$geoip_block$geoip_exempt" $geoip_deny {
    "10"    1;
    default 0;
}


# ------------------------------------------------------------------------------
# 第二部分：server { } 内（放在 listen / server_name 之后）
# ------------------------------------------------------------------------------
server {
    listen       80;
    server_name  example.com;

    # geo 变量为 1 时直接拒绝。
    # 只在 if 里写 return 是官方明确认可的少数安全用法（"if is evil" 文档）
    if ($geoip_deny) {
        # 403 会正常响应；想更"隐身"可改成 return 444;（直接断连、不回包）
        return 403;
    }

    # 想给拦截请求一个自定义页面时：
    # error_page 403 /403.html;
    # location = /403.html { internal; root C:/nginx/html; }

    location / {
        root  C:/www/example;
        index index.html;
    }
}


# ==============================================================================
#  附加说明
# ==============================================================================
#
# 【1】为什么不用 allow / deny？
#      ngx_http_access_module 的规则是「按书写顺序逐条比对」，条目上万后每个请求
#      都要线性扫一遍；geo 模块用 radix 树，O(log n)，几万条也是常数级开销。
#
# 【2】上游有 CDN / SLB / 反代时（必看）
#      直接取 $remote_addr 会把 CDN 节点 IP 当成客户端 IP，结果要么全放行要么全拦。
#      必须先 realip（realip 在 POST_READ 阶段执行，早于 rewrite 阶段的 if，顺序没问题）：
#
#        # http{} 内
#        set_real_ip_from 10.0.0.0/8;          # 你的 CDN 回源网段
#        set_real_ip_from 1.2.3.0/24;
#        real_ip_header   X-Forwarded-For;     # 或 X-Real-IP
#        real_ip_recursive on;
#
# 【3】Windows 版 nginx 的两点限制（http://nginx.org/en/docs/windows.html）
#      - 虽然可设多个 worker，但只有一个真正干活；别指望高并发
#      - 不能作为 Windows 服务运行，需用 WinSW / NSSM 包一层，或开机脚本 start nginx
#      - 不支持第三方 / 动态模块 => ngx_http_geoip2_module（读 mmdb）根本装不上
#
# 【4】想真正直读 mmdb 的唯一干净路径
#      换 Linux（或 nginx 跑在 Linux 容器/LB 上），编译 --add-module=ngx_http_geoip2_module，
#      配置：
#        http {
#            geoip2 C:/geoip/GeoLite2-Country.mmdb {
#                $geoip2_country_code country iso_code;
#            }
#            map $geoip2_country_code $geoip_deny { default 1; CN 0; }
#        }
#      这也是脚本照样每周拉 mmdb 的原因——将来迁移时文件已在本地。
